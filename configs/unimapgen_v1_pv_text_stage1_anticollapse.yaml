seed: 42
output_dir: outputs/unimapgen_v1_pv_text_stage1_anticollapse

data:
  nuscenes_root: /media/winkness/data/nuscenes
  nuscenes_map_pkl_dir: /media/winkness/data/nuscenes/maptrv2_pkl
  satmap_root: /media/winkness/code/jn/HRMapNet/data/opensatmap_nuscenes_cropped
  train_split: val
  val_split: val
  max_train_samples: 64
  max_val_samples: 32
  image_size: 512
  use_pv: true
  use_text_prompt: true
  text_prompt_mode: trace_points
  text_num_trace_points: 8
  use_state_update: false
  state_update_mode: sample_prev
  state_prefix_mode: all
  pv_camera: CAM_FRONT
  pv_num_frames: 3
  pv_image_size: [224, 400]
  num_workers: 0
  train_augment: false
  aug_rot90_prob: 0.0
  aug_hflip_prob: 0.0
  aug_vflip_prob: 0.0

serialization:
  sample_interval_meter: 6.0
  max_lines: 64
  max_points_per_line: 48
  max_seq_len: 640
  categories:
    - divider
    - boundary
    - ped_crossing
    - centerline

model:
  arch: baseline_v1
  d_model: 128
  num_heads: 4
  num_decoder_layers: 3
  ff_dim: 512
  dropout: 0.1
  cnn_channels: [32, 64, 128]
  memory_tokens_hw: [6, 6]
  pv_cnn_channels: [32, 64, 128]
  pv_memory_tokens_hw: [2, 4]
  num_prompt_types: 4

train:
  batch_size: 2
  epochs: 2
  lr: 0.0002
  weight_decay: 0.01
  warmup_steps: 20
  grad_clip_norm: 1.0
  amp: false
  log_every: 8
  save_every: 1
  label_smoothing: 0.05
  eos_loss_weight: 0.35
  modality_mask:
    enable: true
    bev_drop_prob: 0.10
    pv_drop_prob: 0.20

decode:
  min_new_tokens: 64
  temperature: 0.9
  top_k: 5
  repetition_penalty: 1.1
