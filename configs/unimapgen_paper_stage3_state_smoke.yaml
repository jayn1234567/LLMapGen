seed: 42
output_dir: outputs/unimapgen_paper_stage3_state_smoke

data:
  nuscenes_root: ${NUSCENES_ROOT:-/media/winkness/data/nuscenes}
  nuscenes_map_pkl_dir: ${NUSCENES_MAP_PKL_DIR:-/media/winkness/data/nuscenes/maptrv2_pkl}
  satmap_root: ${SATMAP_ROOT:-/media/winkness/code/jn/HRMapNet/data/opensatmap_nuscenes_cropped}
  train_split: val
  val_split: val
  max_train_samples: 64
  max_val_samples: 16
  image_size: 512
  use_pv: true
  use_text_prompt: true
  text_prompt_mode: trace_points
  text_num_trace_points: 8
  use_state_update: true
  state_update_mode: patch_scan
  state_prefix_mode: cut_points
  pv_camera: CAM_FRONT
  pv_num_frames: 3
  pv_image_size: [224, 400]
  num_workers: 0
  train_augment: true
  aug_rot90_prob: 0.5
  aug_hflip_prob: 0.5
  aug_vflip_prob: 0.5

serialization:
  sample_interval_meter: 6.0
  max_lines: 64
  max_points_per_line: 48
  max_seq_len: 640
  coord_num_bins: 10000
  angle_num_bins: 10000
  categories:
    - divider
    - boundary
    - ped_crossing
    - centerline

model:
  arch: paper
  bev_encoder_name: facebook/dinov2-large
  llm_name: Qwen/Qwen2.5-1.5B-Instruct
  local_files_only: true
  use_fallback: true
  d_model_fallback: 256
  cnn_channels: [32, 64, 128]
  pv_cnn_channels: [32, 64, 128]
  pv_memory_tokens_hw: [2, 4]
  num_prompt_types: 4

train:
  batch_size: 1
  epochs: 2
  lr: 0.00002
  weight_decay: 0.01
  warmup_steps: 20
  grad_clip_norm: 1.0
  amp: false
  log_every: 1
  save_every: 1
  init_checkpoint: outputs/unimapgen_paper_stage2_align_smoke/latest.pt
  freeze_module_prefixes: []
  modality_mask:
    enable: true
    bev_drop_prob: 0.2
    pv_drop_prob: 0.2
